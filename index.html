<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mahatma Gandhi — 3D AR Experience</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --saffron: #FF9933; --deep: #1a1208; --gold: #C8972A; --cream: #F5EDD8; --stone: #8C7B65; --white: #FAF7F2; }
    html, body { height: 100%; background: var(--deep); color: var(--cream); font-family: 'Jost', sans-serif; font-weight: 300; overflow-x: hidden; }
    header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 18px 32px; background: linear-gradient(to bottom, rgba(26,18,8,0.95), transparent); }
    .logo { font-family: 'Cormorant Garamond', serif; font-size: 13px; letter-spacing: 0.35em; text-transform: uppercase; color: var(--gold); opacity: 0.8; }
    .badge { display: flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--stone); }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--saffron); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .viewer-wrap { position: relative; width: 100%; height: 100vh; display: flex; flex-direction: column; }
    model-viewer { width: 100%; flex: 1; background: radial-gradient(ellipse at 50% 60%, #2e1f0a 0%, #100c04 60%, #0a0804 100%); --poster-color: transparent; }
    #ar-button { position: absolute; bottom: 28px; right: 28px; display: flex; align-items: center; gap: 10px; background: var(--saffron); color: var(--deep); border: none; border-radius: 50px; padding: 13px 22px; font-family: 'Jost', sans-serif; font-size: 13px; font-weight: 400; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 30px rgba(255,153,51,0.4); transition: all 0.25s ease; }
    #ar-button:hover { background: #ffad52; transform: translateY(-2px); }
    #loading-overlay { position: absolute; inset: 0; background: var(--deep); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 10; transition: opacity 0.6s ease; }
    #loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .spinner { width: 44px; height: 44px; border: 2px solid rgba(200,151,42,0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-family: 'Cormorant Garamond', serif; font-size: 14px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--stone); }
    #error-msg { display: none; color: #ff6b6b; font-size: 13px; text-align: center; max-width: 300px; line-height: 1.6; }
    .info-panel { position: absolute; bottom: 28px; left: 28px; max-width: 340px; pointer-events: none; }
    .info-name { font-family: 'Cormorant Garamond', serif; font-size: clamp(28px, 5vw, 42px); font-weight: 300; line-height: 1.1; color: var(--white); margin-bottom: 6px; }
    .info-name em { font-style: italic; color: var(--gold); }
    .info-dates { font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--stone); margin-bottom: 14px; }
    .info-quote { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15px; line-height: 1.65; color: rgba(245,237,216,0.65); border-left: 2px solid var(--saffron); padding-left: 14px; }
    .gold-line { position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: 0.4; }
    .source-tag { position: absolute; top: 72px; left: 32px; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(140,123,101,0.5); }
    .controls-hint { position: absolute; top: 80px; right: 20px; display: flex; flex-direction: column; gap: 8px; opacity: 0.5; }
    .hint-item { display: flex; align-items: center; gap: 8px; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--stone); }
    .hint-icon { width: 28px; height: 28px; border: 1px solid rgba(140,123,101,0.4); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    @media (max-width: 600px) { .controls-hint { display: none; } .info-panel { max-width: 260px; bottom: 16px; left: 16px; } #ar-button { bottom: 100px; right: 16px; } #qr-panel { display: none !important; } }
    #qr-panel { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); background: rgba(26,18,8,0.92); border: 1px solid rgba(200,151,42,0.25); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 50; backdrop-filter: blur(8px); }
    #qr-panel canvas { border-radius: 6px; display: block; }
    #qr-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--stone); }
    #qr-url { font-size: 10px; color: var(--gold); opacity: 0.7; }
    #qr-toggle { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); background: rgba(26,18,8,0.85); border: 1px solid rgba(200,151,42,0.3); border-radius: 50px; padding: 8px 16px; font-family: 'Jost', sans-serif; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); cursor: pointer; z-index: 51; display: flex; align-items: center; gap: 7px; transition: all 0.2s; }
    #qr-toggle:hover { background: rgba(200,151,42,0.15); }
    #qr-toggle svg { width: 14px; height: 14px; }
  </style>
</head>
<body>
<header>
  <span class="logo">Gandhi Heritage Project</span>
  <span class="badge"><span class="badge-dot"></span>3D · AR Ready</span>
</header>

<div class="viewer-wrap">
  <div class="gold-line"></div>
  <span class="source-tag">Mapusa, Goa · 3D Scan</span>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Loading model…</div>
    <div id="error-msg"></div>
  </div>

  <model-viewer
    id="viewer"
    src="./gandhi_plain.glb"
    ios-src="./gandhi_plain.usdz"
    alt="Mahatma Gandhi Statue from Mapusa, Goa"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    auto-rotate-delay="1000"
    rotation-per-second="8deg"
    shadow-intensity="1.2"
    shadow-softness="0.8"
    exposure="1.1"
    environment-image="neutral"
    touch-action="pan-y"
  >
    <button slot="ar-button" id="ar-button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 3H3v4M19 3h2v4M5 21H3v-4M19 21h2v-4"/>
        <rect x="7" y="7" width="10" height="10" rx="1"/>
      </svg>
      View in Your Space
    </button>
  </model-viewer>

  <div class="info-panel">
    <div class="info-name">Mahatma<br><em>Gandhi</em></div>
    <div class="info-dates">Oct 2, 1869 — Jan 30, 1948</div>
    <div class="info-quote">"Be the change you wish<br>to see in the world."</div>
  </div>

  <div class="controls-hint">
    <div class="hint-item"><div class="hint-icon">⟳</div>Drag to rotate</div>
    <div class="hint-item"><div class="hint-icon">⤢</div>Pinch to zoom</div>
  </div>

  <button id="qr-toggle" onclick="toggleQR()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
      <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="3" height="3"/>
    </svg>
    Scan QR
  </button>

  <div id="qr-panel" style="display:none;">
    <div id="qr-label">Scan to open on phone</div>
    <canvas id="qr-canvas" width="160" height="160"></canvas>
    <div id="qr-url">rohnnair.github.io/gandhi-ar</div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  let qrGenerated = false;

  function toggleQR() {
    const panel = document.getElementById('qr-panel');
    const btn = document.getElementById('qr-toggle');
    const visible = panel.style.display !== 'none';
    panel.style.display = visible ? 'none' : 'flex';
    btn.style.top = visible ? '70px' : (panel.offsetHeight + 80 + 10) + 'px';

    if (!qrGenerated && !visible) {
      qrGenerated = true;
      setTimeout(() => {
        const div = document.createElement('div');
        const qr = new QRCode(div, {
          text: 'https://rohnnair.github.io/gandhi-ar',
          width: 160, height: 160,
          colorDark: '#1a1208', colorLight: '#F5EDD8',
          correctLevel: QRCode.CorrectLevel.H
        });
        setTimeout(() => {
          const src = div.querySelector('canvas')?.toDataURL() || div.querySelector('img')?.src;
          if (src) {
            const canvas = document.getElementById('qr-canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.onload = () => ctx.drawImage(img, 0, 0, 160, 160);
            img.src = src;
          }
        }, 300);
      }, 50);
    }
  }

  const viewer = document.getElementById('viewer');
  const overlay = document.getElementById('loading-overlay');
  const errorMsg = document.getElementById('error-msg');

  viewer.addEventListener('load', () => {
    overlay.classList.add('hidden');
  });

  viewer.addEventListener('error', (e) => {
    document.querySelector('.spinner').style.display = 'none';
    document.querySelector('.loading-text').style.display = 'none';
    errorMsg.style.display = 'block';
    errorMsg.textContent = 'Error: ' + (e.detail?.message || JSON.stringify(e.detail) || 'Failed to load model');
  });

  setTimeout(() => {
    if (!overlay.classList.contains('hidden')) {
      document.querySelector('.spinner').style.display = 'none';
      document.querySelector('.loading-text').style.display = 'none';
      errorMsg.style.display = 'block';
      errorMsg.textContent = 'Timed out — check the browser console for details.';
    }
  }, 20000);
</script>
</body>
</html>
